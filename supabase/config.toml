project_id = "mapa-de-campanha"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 3000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Inscricao aberta: qualquer pessoa cria conta, que nasce "aguardando".
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10
password_requirements = ""

# "Sessao expira apos 7 dias sem uso" (Requisitos nao funcionais).
# O Supabase hospedado so aceita configurar sessoes no plano Pro; no plano
# gratuito o "supabase config push" e recusado com esta secao presente. Por
# isso ela fica comentada. Para religar num plano Pro, descomente:
# [auth.sessions]
# inactivity_timeout = "168h"

[auth.email]
enable_signup = true
# Nenhum e-mail e enviado pelo app: confirmacao desligada e nenhum template.
double_confirm_changes = false
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.rate_limit]
# Limite de inscricoes por IP (defesa contra inscricoes falsas em massa).
sign_in_sign_ups = 30
token_refresh = 150
# O Supabase hospedado exige no minimo 1. Sem efeito: o login anonimo esta
# desligado (enable_anonymous_sign_ins = false).
anonymous_users = 1

[auth.mfa]
max_enrolled_factors = 0

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.admin-usuarios]
verify_jwt = true

[analytics]
enabled = false
